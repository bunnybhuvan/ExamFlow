services:
  - type: web
    name: examflow-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    disk:
      name: examflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.16
      - key: EXAMFLOW_DB_PATH
        value: /var/data/examflow.db
      - key: EXAMFLOW_CORS_ORIGINS
        sync: false
