name: Production acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-acceptance.yml"

permissions:
  contents: read

jobs:
  production-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify production health, authentication gate and CORS
        env:
          API_BASE_URL: https://examflow-api-f24k.onrender.com/api/v1
          FRONTEND_ORIGIN: https://examflow-theta.vercel.app
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          base = os.environ["API_BASE_URL"]
          origin = os.environ["FRONTEND_ORIGIN"]

          def get(path):
              request = urllib.request.Request(base + path, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.status, json.loads(response.read())

          status, health = get("/health")
          assert status == 200, health
          print("PASS: public API health")

          status, database = get("/health/database")
          assert status == 200 and database.get("status") == "connected", database
          assert database.get("database") == "postgresql", database
          print("PASS: hosted PostgreSQL")

          status, auth = get("/auth/config")
          assert status == 200 and auth.get("enabled") is True, auth
          print("PASS: production authentication is enabled")

          request = urllib.request.Request(base + "/students", headers={"Accept": "application/json"})
          try:
              urllib.request.urlopen(request, timeout=30)
              raise AssertionError("Protected student data endpoint unexpectedly allowed anonymous access")
          except urllib.error.HTTPError as error:
              assert error.code == 401, (error.code, error.read().decode())
          print("PASS: anonymous access to protected data is rejected")

          request = urllib.request.Request(
              base + "/health",
              method="OPTIONS",
              headers={"Origin": origin, "Access-Control-Request-Method": "GET"}
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              allowed = response.headers.get("Access-Control-Allow-Origin")
              assert response.status == 200 and allowed == origin, (response.status, allowed)
          print("PASS: production frontend CORS origin")
          PY
