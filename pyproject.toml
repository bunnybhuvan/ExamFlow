[project]
name = "examflow"
version = "1.0.0"
description = "Intelligent examination scheduling system"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "SQLAlchemy>=2.0,<3.0", "pydantic>=2.8,<3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
